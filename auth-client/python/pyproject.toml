[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-auth-client"
version = "0.3.0"
description = "Provider-neutral OAuth and MCP resource-server SDK"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["httpx>=0.27,<1", "PyJWT[crypto]>=2.9,<3"]
authors = [{ name = "Prince Roshan" }]

[project.optional-dependencies]
fastmcp = ["fastmcp>=3.2,<5"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
