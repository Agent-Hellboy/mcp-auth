worker_processes 1;
pid /tmp/mcp-auth-nginx.pid;

events {}

http {
    access_log /dev/stdout;
    error_log /dev/stderr warn;
    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    server {
        listen 6328;

        # The Databricks example documents a service-scoped PRM URL while its
        # FastMCP app mounts the generated route with /mcp appended.
        location = /.well-known/oauth-protected-resource/databricks {
            proxy_pass http://127.0.0.1:6329/.well-known/oauth-protected-resource/databricks/mcp;
        }

        location / {
            proxy_pass http://127.0.0.1:6329;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_buffering off;
        }
    }
}
