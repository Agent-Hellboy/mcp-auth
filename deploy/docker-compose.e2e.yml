services:
  mock-oidc:
    build:
      context: ..
      dockerfile: tests/e2e/Dockerfile.mock-oidc
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8082/healthz')
      interval: 2s
      timeout: 2s
      retries: 15

  mcp-auth-keygen:
    image: alpine:3.22
    command: >-
      sh -c "apk add --no-cache openssl >/dev/null &&
      chmod 0777 /keys /data && openssl genrsa -out /keys/signing.pem 2048 &&
      chmod 0644 /keys/signing.pem && sleep infinity"
    volumes:
      - mcp-auth-keys:/keys
      - mcp-auth-data:/data
    healthcheck:
      test: ["CMD", "test", "-s", "/keys/signing.pem"]
      interval: 2s
      timeout: 2s
      retries: 15

  # Generates the resource server's (databricks-mcp) private_key_jwt key pair
  # once, out of band, so its public half can be registered with mcp-auth
  # ahead of time. This mirrors real deployment: the auth server must know a
  # resource server's public key before it can verify that resource server's
  # token-exchange requests.
  resource-keygen:
    image: alpine:3.22
    # Mounted at the same path every consumer uses (/var/lib/mcp-resource-auth),
    # since resource-clients.json embeds an absolute public_key_file path that
    # mcp-auth reads from its own container's filesystem, not this one's.
    command: >-
      sh -c "apk add --no-cache openssl >/dev/null &&
      chmod 0777 /var/lib/mcp-resource-auth &&
      openssl genrsa -out /var/lib/mcp-resource-auth/private.pem 2048 &&
      openssl rsa -in /var/lib/mcp-resource-auth/private.pem -pubout -out /var/lib/mcp-resource-auth/public.pem &&
      printf '%s\n' compose-e2e-key > /var/lib/mcp-resource-auth/key_id &&
      printf '%s' '[{\"client_id\":\"compose-resource-server\",\"name\":\"databricks-mcp e2e\",\"public_key_file\":\"/var/lib/mcp-resource-auth/public.pem\"}]' > /var/lib/mcp-resource-auth/resource-clients.json &&
      chmod 0644 /var/lib/mcp-resource-auth/private.pem /var/lib/mcp-resource-auth/public.pem /var/lib/mcp-resource-auth/key_id /var/lib/mcp-resource-auth/resource-clients.json &&
      sleep infinity"
    volumes:
      - resource-auth-keys:/var/lib/mcp-resource-auth
    healthcheck:
      test: ["CMD", "test", "-s", "/var/lib/mcp-resource-auth/resource-clients.json"]
      interval: 2s
      timeout: 2s
      retries: 15

  mcp-server:
    build:
      context: ..
      dockerfile: tests/e2e/Dockerfile.databricks-mcp
    environment:
      DATABRICKS_HOST: https://workspace.cloud.databricks.com
      PUBLIC_BASE_URL: http://mcp-server:6328/databricks
      MCP_SERVER_URL: http://mcp-server:6328/databricks
      MCP_AUTH_ISSUER: http://mcp-auth:8080
      MCP_AUTH_JWKS_URI: http://mcp-auth:8080/.well-known/jwks.json
      MCP_AUTH_TOKEN_ENDPOINT: http://mcp-auth:8080/token
      MCP_AUTH_CONNECTOR: compose-downstream
      MCP_AUTH_CLIENT_ID: compose-resource-server
      MCP_AUTH_CLIENT_PRIVATE_KEY_FILE: /var/lib/mcp-resource-auth/private.pem
      MCP_AUTH_CLIENT_KEY_ID_FILE: /var/lib/mcp-resource-auth/key_id
      DATABRICKS_REQUIRED_GROUP: compose-test-group
      DATABRICKS_ALLOWED_WAREHOUSE_IDS: compose-test-warehouse
      MCP_METRICS_ENABLED: "false"
    volumes:
      - resource-auth-keys:/var/lib/mcp-resource-auth:ro
    depends_on:
      resource-keygen:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:6328/.well-known/oauth-protected-resource/databricks/mcp')
      interval: 2s
      timeout: 2s
      retries: 15

  mcp-auth:
    build:
      context: ../auth-server
      dockerfile: Dockerfile
    environment:
      MCP_AUTH_ISSUER: http://mcp-auth:8080
      MCP_AUTH_RESOURCE: http://mcp-server:6328/databricks/mcp
      MCP_AUTH_LISTEN_ADDR: :8080
      MCP_AUTH_ALLOWED_SCOPES: tools:read
      MCP_AUTH_REQUIRE_HTTPS: "false"
      MCP_AUTH_REGISTRATION_ENABLED: "true"
      MCP_AUTH_AUTHORIZATION_RESPONSE_ISS: "true"
      MCP_AUTH_PRIVATE_KEY_FILE: /keys/signing.pem
      MCP_AUTH_STORE: sqlite
      MCP_AUTH_DATABASE_URL: /data/mcp-auth.db
      MCP_AUTH_CONNECTORS_FILE: /etc/mcp-auth/connectors.json
      MCP_AUTH_CONNECTOR: compose-oidc
      MCP_AUTH_ALLOW_INSECURE_CONNECTORS: "true"
      MCP_AUTH_RESOURCE_CLIENTS_FILE: /var/lib/mcp-resource-auth/resource-clients.json
    volumes:
      - mcp-auth-keys:/keys:ro
      - mcp-auth-data:/data
      - ../tests/e2e/mock-oidc-connectors.json:/etc/mcp-auth/connectors.json:ro
      - resource-auth-keys:/var/lib/mcp-resource-auth:ro
    depends_on:
      mcp-server:
        condition: service_healthy
      mock-oidc:
        condition: service_healthy
      mcp-auth-keygen:
        condition: service_healthy
      resource-keygen:
        condition: service_healthy

  e2e-client:
    build:
      context: ..
      dockerfile: tests/e2e/Dockerfile.e2e-client
    volumes:
      - resource-auth-keys:/var/lib/mcp-resource-auth:ro
    depends_on:
      mcp-auth:
        condition: service_started
      mcp-server:
        condition: service_healthy
      resource-keygen:
        condition: service_healthy

networks:
  default:
    name: ${MCP_AUTH_E2E_NETWORK:-mcp-auth-e2e}
    ipam:
      config:
        - subnet: ${MCP_AUTH_E2E_SUBNET:-172.29.0.0/24}

volumes:
  mcp-auth-keys:
  mcp-auth-data:
  resource-auth-keys:
